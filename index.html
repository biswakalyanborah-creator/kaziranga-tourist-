<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borah Service | Kaziranga Luxury Safari</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --surface: #121215;
            --surface-card: #18181b;
            --border: #27272a;
            --primary: #d4af37;
            --primary-hover: #c5a059;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .app-header {
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
        }

        .header-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .main-wrapper {
            max-width: 480px;
            margin: 0 auto;
        }

        .page-panel {
            display: none;
        }
        .page-panel.active {
            display: block;
        }

        .hero-banner {
            margin: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1564760055775-d63b19a55388?auto=format&fit=crop&w=800&q=80') center/cover;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .hero-banner h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-banner p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .section-header {
            padding: 0 16px;
            margin: 20px 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .packages-grid {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pkg-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .pkg-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #27272a;
        }

        .pkg-body {
            padding: 16px;
        }

        .pkg-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .pkg-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .pkg-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .pkg-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
        }

        .btn-gold {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .booking-box, .admin-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
        }

        .form-control {
            margin-bottom: 14px;
        }

        .form-control label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control input, .form-control select, .form-control textarea {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px;
            margin: 16px;
            text-align: center;
        }

        .profile-avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin: 0 auto 14px auto;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-role {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .profile-bio {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-social {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-fb { background: #1877f2; color: #fff; }
        .btn-wa { background: #25d366; color: #000; }

        .employee-list {
            margin-top: 15px;
            background: var(--surface-card);
            border-radius: 10px;
            padding: 12px;
            text-align: left;
        }
        .employee-item {
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        .employee-item:last-child { border-bottom: none; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-btn span.icon { font-size: 20px; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-title">Borah Service</div>
        <div class="header-badge" onclick="switchTab('admin', document.querySelectorAll('.nav-btn')[2])">⚙️ Admin Panel</div>
    </header>

    <div class="main-wrapper">

        <!-- HOME PANEL -->
        <div id="panel-home" class="page-panel active">
            <div class="hero-banner">
                <h1>Kaziranga National Park</h1>
                <p>Official Luxury Jeep & Elephant Safari Expeditions</p>
            </div>

            <div class="section-header">
                <h2>Featured Safari Packages</h2>
            </div>

            <div class="packages-grid" id="dynamicPackagesContainer">
                <!-- Dynamic packages load here -->
            </div>
        </div>

        <!-- BOOKING PANEL -->
        <div id="panel-booking" class="page-panel">
            <div class="section-header" style="margin-top: 16px;">
                <h2>Instant Slot Reservation</h2>
            </div>
            <div class="booking-box">
                <div class="form-control">
                    <label>Your Full Name</label>
                    <input type="text" id="bookName" placeholder="Enter your name...">
                </div>
                <div class="form-control">
                    <label>Select Safari / Range</label>
                    <select id="bookRange">
                        <option value="Kohora Central Range (Jeep Safari)">Kohora Central Range (Jeep Safari)</option>
                        <option value="Bagori Western Range (Jeep Safari)">Bagori Western Range (Jeep Safari)</option>
                        <option value="Agoratoli Eastern Range (Jeep Safari)">Agoratoli Eastern Range (Jeep Safari)</option>
                        <option value="Elephant Safari (Morning Slot)">Elephant Safari (Morning Slot)</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Preferred Date</label>
                    <input type="date" id="bookDate">
                </div>
                <div class="form-control">
                    <label>Number of Guests</label>
                    <select id="bookGuests">
                        <option value="1-6 Persons (1 Jeep)">1 - 6 Persons (1 Jeep)</option>
                        <option value="7-12 Persons (2 Jeeps)">7 - 12 Persons (2 Jeeps)</option>
                        <option value="Custom Group (>12)">Custom Group (> 12 Persons)</option>
                    </select>
                </div>
                <button class="btn-gold" style="width: 100%; padding: 14px; font-size: 14px; margin-top: 6px;" onclick="submitBooking()">Book Instantly via WhatsApp 🚀</button>
            </div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="panel-admin" class="page-panel">
            <div class="section-header" style="margin-top: 16px;">
                <h2>Admin Control Center</h2>
            </div>
            
            <div class="admin-box">
                <h3 style="font-size: 14px; color: var(--primary); margin-bottom: 12px;">➕ Add Custom Package & Price</h3>
                <div class="form-control">
                    <label>Package Title / Range</label>
                    <input type="text" id="admTitle" placeholder="e.g. Burapahar Range">
                </div>
                <div class="form-control">
                    <label>Price (in INR)</label>
                    <input type="text" id="admPrice" placeholder="e.g. ₹4,000 / Jeep">
                </div>
                <div class="form-control">
                    <label>Description</label>
                    <input type="text" id="admDesc" placeholder="Short description...">
                </div>
                <div class="form-control">
                    <label>Image URL</label>
                    <input type="text" id="admImg" placeholder="Paste direct image link...">
                </div>
                <button class="btn-gold" style="width: 100%; padding: 10px;" onclick="addNewPackage()">Add Package to Site</button>
            </div>

            <div class="admin-box">
                <h3 style="font-size: 14px; color: var(--primary); margin-bottom: 12px;">👤 Add Employee / Guide</h3>
                <div class="form-control">
                    <label>Employee Name</label>
                    <input type="text" id="empName" placeholder="e.g. Rahul Borah">
                </div>
                <div class="form-control">
                    <label>Role / Phone</label>
                    <input type="text" id="empRole" placeholder="e.g. Senior Guide - 9101XXXXXX">
                </div>
                <button class="btn-gold" style="width: 100%; padding: 10px;" onclick="addEmployee()">Add Employee</button>
            </div>
        </div>
